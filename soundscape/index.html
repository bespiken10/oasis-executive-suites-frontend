<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
 --stone:#d4cfc4;--smoke:#9a958c;--deep-earth:#4a4640;--void:#2a2622;
 --gold:#c9a66b;--silence:#f5f3ef;
}

body{font-family:'Georgia',serif;background:var(--silence);color:var(--deep-earth);line-height:1.8;overflow-x:hidden;}
h1,h2,h3{font-family:'Garamond','Georgia',serif;font-weight:300;letter-spacing:.05em;}
.sans{-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-weight:300;letter-spacing:.08em;}

section{opacity:0;transform:translateY(30px);transition:1.4s ease;}
section.visible{opacity:1;transform:translateY(0);}

/* ---------------- HERO ----------------*/
.hero{
  min-height:100vh;
  background:url("Images/hero.webp") center/cover no-repeat fixed;
  display:flex;align-items:center;justify-content:center;
  text-align:center;position:relative;color:#fff;padding:0;
}
.hero-overlay{
  position:absolute;inset:0;
  background:rgba(0,0,0,0.32);
  backdrop-filter:blur(1px);
  box-shadow:inset 0 0 200px rgba(0,0,0,.6);
}
.hero-content{position:relative;z-index:2;max-width:780px;padding:3rem 2rem;}
.hero h1{font-size:clamp(2.6rem,6vw,5rem);line-height:1.3;margin-bottom:1.6rem;color:#fff;}
.identity-line{font-size:1.3rem;max-width:760px;margin:auto;opacity:.9;margin-bottom:2.2rem;color:#fff;}
.cta-primary{padding:1.1rem 2.6rem;background:#fff;color:#111;border-radius:40px;text-decoration:none;font-weight:500;}
.cta-primary:hover{background:#f0f0f0;}

/* ------------- CONTENT ----------------*/
.tension{padding:7rem 2rem;max-width:1100px;margin:auto;}
.tension-grid{margin-top:3rem;display:grid;gap:2rem;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));}
.tension-item{background:#fff;padding:2rem;border-radius:10px;box-shadow:0 5px 18px rgba(0,0,0,.06);}

.opportunity{padding:7rem 2rem;text-align:center;max-width:900px;margin:auto;}
.opportunity-text{font-size:1.2rem;opacity:.85;line-height:2;margin-top:2rem;}

.offers{padding:7rem 2rem;max-width:1200px;margin:auto;}
.offers-grid{display:grid;gap:2.2rem;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));}
.offer-card{background:var(--silence);padding:2rem;border-radius:12px;transition:.4s;}
.offer-card:hover{transform:scale(1.02);}

/* ---------------- REELS ----------------*/
.reels{padding:7rem 2rem;background:var(--stone);}
.reels-grid{display:grid;gap:2rem;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));}
.reel-card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 6px 22px rgba(0,0,0,.08);color:var(--void);text-decoration:none;}
.reel-thumb{height:200px;background-size:cover;background-position:center;filter:brightness(.92);transition:.4s;}
.reel-card:hover .reel-thumb{transform:scale(1.05);}
.reel-placeholder{padding:1rem;text-align:center;}

/* ------------------ SOUL CALL (FIXED) ------------------ */

.soul-call{
  text-align:center;
  padding:5rem 2rem 6rem;
  background:var(--void);
  color:#fff;
}

.soul-call h2{
  font-size:2.8rem;
  color:var(--gold);
  margin-bottom:1rem;
}

.soul-call p{
  font-size:1.15rem;
  max-width:600px;
  margin:0 auto 2rem;
  opacity:.9;
}

/* Main CTA */
.cta-private{
  background:var(--gold);
  padding:1.1rem 2.4rem;
  border-radius:45px;
  font-size:1.25rem;
  color:var(--void);
  text-decoration:none;
  display:inline-block;
  margin-bottom:2.8rem;
  font-weight:600;
  transition:.3s;
}
.cta-private:hover{
  opacity:.88;
  transform:scale(1.03);
}

/* 3 buttons row */
.soul-ctas{
  display:flex;
  justify-content:center;
  gap:2rem;
  flex-wrap:wrap;
}

.soul-cta{
  padding:.85rem 2.2rem;
  border:2px solid var(--gold);
  color:var(--gold);
  border-radius:50px;
  min-width:160px;
  font-size:1.1rem;
  text-align:center;
  transition:.3s;
}
.soul-cta:hover{
  background:var(--gold);
  color:var(--void);
  transform:translateY(-3px);
}

/* footer unchanged — keep it if already present below */
footer{text-align:center;padding:3rem;font-size:.9rem;background:var(--void);color:#bbb;margin-top:6rem;}

<!-- JS -->
<script>
// Scroll Fade
const sections=document.querySelectorAll("section");
const obs=new IntersectionObserver(e=>{e.forEach(x=>x.isIntersecting&&x.target.classList.add("visible"))},{threshold:.15});
sections.forEach(s=>obs.observe(s));

// Load Reels
async function loadReels(){
const api="https://script.google.com/macros/s/AKfycbzWWyeOlGM8rHNGOdZJYx4h-p-oHnn_4B-tVTHonynZ3v15-NuCQdfjyW1WmT-FIQ4/exec";
try{
const r=await fetch(api).then(r=>r.json());
const box=document.getElementById("reels-container");
box.innerHTML="";
r.forEach(v=>{
if(!v.instagram_url)return;
box.innerHTML+=`
<a class="reel-card" href="${v.instagram_url}" target="_blank">
<div class="reel-thumb"></div>
<div class="reel-placeholder">${v.Title||"Untitled"}</div>
</a>`;
});
}catch{document.getElementById("reels-container").innerHTML="<p>Unable to load reels</p>";}
}
loadReels();
</script>

<script src="reels.js"></script>
