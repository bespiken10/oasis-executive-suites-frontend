<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oasis Executive Suites — Chat with Concierge</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap');

  :root{
    --ink: #1A0B56;
    --ink-deep: #12083E;
    --gold: #ED9F15;
    --gold-soft: #F5C877;
    --cream: #F4EFE4;
    --whisper: rgba(244,239,228,0.62);
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0; padding:0; height:100%;
    background: var(--ink);
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    overflow-x:hidden;
  }

  .stage{
    position:relative;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding: 8vh 6vw 6vh;
    text-align:center;
    /* single, centered, softly-feathered glow — no seams, no directional haze */
    background: var(--ink);
    background-image: radial-gradient(circle at 50% 38%, rgba(237,159,21,0.10), rgba(237,159,21,0) 55%);
  }

  /* faint scattered stars, echoing the lunar mark in the logo */
  .stars{
    position:absolute; inset:0; pointer-events:none;
    opacity:0.7;
    background-image:
      radial-gradient(1.2px 1.2px at 14% 22%, rgba(245,200,119,0.45), transparent 60%),
      radial-gradient(1.2px 1.2px at 84% 18%, rgba(245,200,119,0.35), transparent 60%),
      radial-gradient(1px 1px at 26% 76%, rgba(245,200,119,0.3), transparent 60%),
      radial-gradient(1.2px 1.2px at 72% 80%, rgba(245,200,119,0.4), transparent 60%),
      radial-gradient(1px 1px at 90% 58%, rgba(245,200,119,0.28), transparent 60%),
      radial-gradient(1px 1px at 9% 55%, rgba(245,200,119,0.25), transparent 60%);
  }

  .logo-wrap{
    position:relative;
    width: min(326px, 62vw);
    margin: 0 auto 2.2rem;
    display:flex;
    align-items:center;
    justify-content:center;
    /* soft glow drawn directly on the wrapper — no separate blurred layer,
       so there is no hard edge that can render as a line/seam */
    background: radial-gradient(circle, rgba(237,159,21,0.20) 0%, rgba(237,159,21,0) 68%);
    padding: 10%;
  }

  .logo-wrap img{
    position:relative;
    width:100%;
    height:auto;
    display:block;
    border:none;
    outline:none;
  }

  .eyebrow{
    font-family:'Inter', sans-serif;
    font-size: 0.72rem;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--gold-soft);
    margin: 0 0 0.9rem;
    opacity:0.85;
  }

  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:500;
    font-size: clamp(1.65rem, 3.4vw, 2.35rem);
    letter-spacing: 0.01em;
    line-height:1.28;
    margin: 0 0 0.9rem;
    color: var(--cream);
    max-width: 22ch;
  }

  p.sub{
    font-size: 0.98rem;
    line-height:1.65;
    color: var(--whisper);
    max-width: 34ch;
    margin: 0 0 2.6rem;
    font-weight:400;
  }

  .cta{
    display:inline-flex;
    align-items:center;
    gap:0.65rem;
    background: linear-gradient(135deg, var(--gold) 0%, #D68A0F 100%);
    color: var(--ink-deep);
    text-decoration:none;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size: 1rem;
    letter-spacing:0.01em;
    padding: 1rem 1.9rem;
    border-radius: 999px;
    box-shadow: 0 8px 30px rgba(237,159,21,0.35), 0 2px 8px rgba(0,0,0,0.25);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }

  .cta:hover{
    transform: translateY(-2px);
    box-shadow: 0 12px 36px rgba(237,159,21,0.45), 0 4px 10px rgba(0,0,0,0.3);
  }

  .cta:active{ transform: translateY(0); }

  .cta svg{ width:22px; height:22px; flex-shrink:0; }

  .footnote{
    margin-top: 2.1rem;
    font-size: 0.76rem;
    letter-spacing:0.04em;
    color: rgba(244,239,228,0.38);
  }

  @media (max-width: 420px){
    .stage{ padding: 10vh 7vw 7vh; }
    p.sub{ font-size:0.92rem; }
  }
</style>
</head>
